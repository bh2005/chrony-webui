server {
    listen 80;
    server_name _;
    root /var/www/chrony-webui;
    index index.html;

    # ACME HTTP-01 (interne step-CA, siehe Zertifikat-Tab / acme.py) —
    # acme.sh legt hier .well-known/acme-challenge/<token> unter CHRONYWEBUI_ACME_WEBROOT ab.
    # Muss auch nach Umstellung auf HTTPS unten in Klartext (Port 80) erreichbar bleiben.
    location /.well-known/acme-challenge/ {
        root /var/www/chrony-webui;
        try_files $uri =404;
    }

    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    location /auth/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

